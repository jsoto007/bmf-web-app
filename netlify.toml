# Netlify configuration — Next.js 14 App Router via Netlify's Next.js Runtime.
# Route handlers (/api/contact, /llms.txt …) run as Netlify Functions; static
# pages are served from the CDN. Set the contact-form env vars in the Netlify
# UI (Site configuration → Environment variables); see .env.example.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# One canonical host: send www (and the netlify.app subdomain) to the apex so
# search engines never see the same page under two URLs.
[[redirects]]
  from = "https://www.burdiermobilephlebotomy.com/*"
  to = "https://burdiermobilephlebotomy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://beamish-sunshine-90f67c.netlify.app/*"
  to = "https://burdiermobilephlebotomy.com/:splat"
  status = 301
  force = true
